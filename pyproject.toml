[project]
name = "marketing-research"
version = "0.1.0"
description = "Local marketing research agent for apps: evidence ledger, source grading, free first-party data scripts"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "google-play-scraper>=1.2.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
